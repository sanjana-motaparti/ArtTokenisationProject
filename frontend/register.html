<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtTokenizer | Register</title>

<style>
  body, html {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #f5e6d3 0%, #e8d4c1 25%, #d4c4b0 50%, #c9b9a8 75%, #b8a798 100%);
    background-attachment: fixed;
    color: #333;
  }

  body::before {
    content: '';
    position: fixed;
    width: 100%;
    height: 100%;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(184,124,76,0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(168,187,163,0.1) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(235,217,209,0.2) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(247,244,234,0.95);
    backdrop-filter: blur(10px);
    padding: 12px 40px;
    display: flex;
    align-items: center;
    box-shadow: 0px 4px 20px rgba(184, 124, 76, 0.15);
    z-index: 1000;
  }

  .logo {
    display: flex;
    align-items: center;
    font-weight: bold;
    font-size: 1.2rem;
    color: #B87C4C;
  }

  .logo img {
    height: 50px;
    margin-right: 10px;
  }

  .register-container {
    margin-top: 130px;
    max-width: 480px;
    background: #fff;
    padding: 40px 35px;
    margin-left: auto;
    margin-right: auto;
    border-radius: 20px;
    box-shadow: 0px 8px 25px rgba(184,124,76,0.2);
    border: 2px solid rgba(184,124,76,0.25);
    text-align: center;
  }

  h2 {
    color: #B87C4C;
    font-size: 2rem;
    margin-bottom: 10px;
  }
  
  p {
    color: #555;
    margin-bottom: 25px;
  }

  .form-group {
    text-align: left;
    margin-bottom: 18px;
  }

  .form-group label {
    font-weight: 500;
    color: #555;
    display: block;
    margin-bottom: 5px;
  }

  .form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid rgba(184,124,76,0.3);
    border-radius: 10px;
    font-size: 1rem;
    background: rgba(255,255,255,0.9);
    transition: 0.3s;
  }

  .form-group input:focus {
    border-color: #B87C4C;
    background: white;
    outline: none;
  }

  .register-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #B87C4C 0%, #A86B3F 100%);
    border: none;
    color: white;
    font-size: 1.1rem;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s ease;
    font-weight: 600;
  }

  .register-btn:hover {
    background: linear-gradient(135deg, #A86B3F 0%, #8B5E34 100%);
    transform: translateY(-2px);
    box-shadow: 0px 5px 15px rgba(184,124,76,0.3);
  }

  .link {
    margin-top: 15px;
    font-size: 0.95rem;
    color: #8B5E34;
  }

  .link a {
    color: #B87C4C;
    font-weight: 600;
    text-decoration: none;
  }

  .msg {
    margin-top: 15px;
    font-weight: bold;
  }

</style>
</head>

<body>

<header class="navbar">
  <div class="logo">
    <img src="logo.png" />
    ArtTokenizer
  </div>
</header>

<div class="register-container">
  <h2>Create Account</h2>
  <p>Register and begin your Art Token journey</p>

  <form id="registerForm">
    
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" id="name" required>
    </div>

    <div class="form-group">
      <label>Email *</label>
      <input type="email" id="email" required>
    </div>

    <div class="form-group">
      <label>Phone Number *</label>
      <input type="text" id="phone" required pattern="[0-9]{10}" title="Enter a valid 10-digit number">
    </div>

    <div class="form-group">
      <label>Password *</label>
      <input type="password" id="password" required minlength="8">
    </div>

    <div class="form-group">
      <label>DeSo Public Key *</label>
      <input type="text" id="desoKey" required>
    </div>

    <button type="submit" class="register-btn">Create Account</button>

  </form>

  <div class="msg" id="message"></div>

  <div class="link">
    Already have an account?  
    <a href="./login.html">Login</a>
  </div>
</div>

<script>
  const form = document.getElementById("registerForm");
  const messageBox = document.getElementById("message");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      password: document.getElementById("password").value,
      desoPublicKey: document.getElementById("desoKey").value
    };

    try {
      const response = await fetch("http://localhost:5000/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (response.ok) {
        messageBox.style.color = "green";
        messageBox.innerText = result.message || "Registration Successful!";
        form.reset();
      } else {
        messageBox.style.color = "red";
        messageBox.innerText = result.message || "Registration failed";
      }

    } catch (err) {
      messageBox.style.color = "red";
      messageBox.innerText = "Server error. Try again.";
    }
  });
</script>

</body>
</html>
