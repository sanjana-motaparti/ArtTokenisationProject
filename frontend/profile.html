<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtTokenizer | Dashboard</title>
<style>
  /* ---------- Reset & Fonts ---------- */
  body, html {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f5f5;
    color: #333;
  }

  a { text-decoration: none; color: inherit; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 220px;
    height: 100%;
    background: #B87C4C;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding-top: 40px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.1);
  }

  .sidebar .logo {
    font-size: 1.5rem;
    font-weight: bold;
    text-align: center;
    margin-bottom: 40px;
  }

  .sidebar nav a {
    padding: 15px 25px;
    display: block;
    font-weight: 500;
    border-left: 4px solid transparent;
    transition: all 0.3s;
    margin-bottom: 5px;
    border-radius: 4px;
  }

  .sidebar nav a:hover {
    background: rgba(255,255,255,0.1);
    border-left: 4px solid #fff;
  }

  /* ---------- Main Content ---------- */
  .main {
    margin-left: 220px;
    padding: 40px;
  }

  .greeting {
    font-size: 2rem;
    font-weight: bold;
    color: #B87C4C;
    margin-bottom: 20px;
  }

  .profile-card {
    background: #fff;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    margin-bottom: 30px;
  }

  .profile-card p {
    font-size: 1rem;
    margin: 10px 0;
  }

  .profile-card p span {
    font-weight: 600;
    color: #555;
  }

  /* ---------- Tokens Section ---------- */
  .tokens {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
    gap: 20px;
  }

  .token-card {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    transition: transform 0.3s, box-shadow 0.3s;
    text-align: center;
  }

  .token-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  }

  .token-card h3 {
    margin-bottom: 10px;
    color: #B87C4C;
  }

  /* ---------- Logout Button ---------- */
  .logout-btn {
    padding: 12px 20px;
    background: #A86B3F;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
    transition: 0.3s;
  }

  .logout-btn:hover {
    background: #8B5E34;
  }

  /* ---------- Responsive ---------- */
  @media(max-width: 768px){
    .sidebar { width: 60px; padding-top: 20px; }
    .sidebar .logo { font-size: 1rem; display: none; }
    .sidebar nav a { padding: 15px 10px; font-size: 0.9rem; }
    .main { margin-left: 60px; padding: 20px; }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo">ArtTokenizer</div>
  <nav>
    <a href="#">Profile</a>
    <a href="#">Your Tokens</a>
    <a href="#">Settings</a>
    <a href="#" id="logoutSidebar">Logout</a>
  </nav>
</div>

<!-- Main Content -->
<div class="main">
  <div class="greeting" id="greeting">Hello!</div>

  <!-- Profile Card -->
  <div class="profile-card">
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>Phone:</strong> <span id="phone"></span></p>
    <p><strong>DeSo Public Key:</strong> <span id="desoKey"></span></p>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <!-- Tokens Section -->
  <h2 style="color:#B87C4C; margin-bottom:15px;">Your Tokens</h2>
  <div class="tokens" id="tokens">
    <!-- Token cards will be added here dynamically -->
  </div>
</div>

<script>
  // Get user from localStorage
  const user = JSON.parse(localStorage.getItem("user"));

  if (!user) {
    window.location.href = "login.html";
  } else {
    document.getElementById("greeting").innerText = `Hello, ${user.name}!`;
    document.getElementById("email").innerText = user.email;
    document.getElementById("phone").innerText = user.phone;
    document.getElementById("desoKey").innerText = user.desoPublicKey;
  }

  // Logout functionality
  const logout = () => {
    localStorage.removeItem("user");
    window.location.href = "login.html";
  };
  document.getElementById("logoutBtn").addEventListener("click", logout);
  document.getElementById("logoutSidebar").addEventListener("click", logout);

  // Dummy tokens - in real app fetch from backend
  const tokens = [
    { title: "Sunset Painting #1", id: "TKN001" },
    { title: "Abstract Art #3", id: "TKN002" },
    { title: "Landscape #5", id: "TKN003" },
  ];

  const tokensContainer = document.getElementById("tokens");
  tokens.forEach(token => {
    const card = document.createElement("div");
    card.className = "token-card";
    card.innerHTML = `<h3>${token.title}</h3><p>ID: ${token.id}</p>`;
    tokensContainer.appendChild(card);
  });
</script>

</body>
</html>
